<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>search</title>
    <link rel="stylesheet" href="./styles/Pages/search.css" />
    <link rel="stylesheet" href="./styles/base.css" />
  </head>
  <body>
    <nav>
      <div class="right">
        <div class="logo">
          <img src="./assets/airbnb.png" alt="Airbnb Logo" />
          <span>airbnb</span>
        </div>
        <ul class="nav-links">
          <li class="link-main"><a href="">Homes nearby</a></li>
          <li class="link-sub"><a href="">Any week</a></li>
          <li class="link-sub"><a href="">Add guests</a></li>
          <button class="search-btn">
            <img src="./assets/search.png" alt="Search Icon" class="icon" />
          </button>
        </ul>
        <button class="filter">
          <img
            src="./assets/filterlight.png"
            alt="Filter Icon"
            class="icon"
          /><span>Filter</span>
        </button>
      </div>
      <div class="left">
        <button class="host-btn">Become a host</button>
        <button class="btn">
          <img src="./assets/user.png" alt="User Icon" class="icon" />
        </button>
        <button class="btn">
          <img src="./assets/menu.png" alt="User Menu Icon" class="icon" />
        </button>
      </div>
    </nav>
    <script src="./scripts/search.js"></script>
  </body>
</html>
